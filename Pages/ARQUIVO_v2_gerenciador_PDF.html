const ICON={};
const uid=()=> (typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`);
const esc=(v)=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const stateDefault=()=>({version:2,contracts:[],employees:[],documents:[],modifiedAt:new Date().toISOString()});

function toast(msg,error=false){const area=$('#toastStack');const n=document.createElement('div');n.className='toast'+(error?' error':'');n.textContent=msg;area.appendChild(n);setTimeout(()=>n.remove(),4800)}
function txn(store,method,...args){return new Promise((resolve,reject)=>{const t=db.transaction(store,method==='get'?'readonly':'readwrite');const req=t.objectStore(store)[method](...args);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function openDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('pdf'))d.createObjectStore('pdf')};r.onsuccess=()=>{db=r.result;resolve()};r.onerror=()=>reject(r.error)})}
async function putPdf(blob,id){await txn('pdf','put',blob,id)}
async function getPdf(id){return id?await txn('pdf','get',id):null}
async function save(){state.modifiedAt=new Date().toISOString();await txn('kv','put',state,'state');scheduleSync();render()}
const dateISO=()=>new Date().toLocaleDateString('en-CA',{timeZone:'America/Sao_Paulo'}); // usado apenas para a data operacional local
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parseDay(str){if(!str||!/^\d{4}-\d{2}-\d{2}$/.test(str))return null;const [y,m,d]=str.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))}
function dayDiff(date){const t=parseDay(today()),d=parseDay(date);return !d?null:Math.round((d.getTime()-t.getTime())/86400000)}
function addPeriod(date,qty,unit){if(!date||!qty||qty<=0)return '';const [y,m,d]=date.split('-').map(Number);if(!y||!m||!d)return '';let month=(m-1)+Number(qty)*(unit==='anos'?12:1);const yy=y+Math.floor(month/12),mm=((month%12)+12)%12;const last=new Date(Date.UTC(yy,mm+1,0)).getUTCDate();return `${yy}-${String(mm+1).padStart(2,'0')}-${String(Math.min(d,last)).padStart(2,'0')}`}
const brDate=s=>s?`${s.slice(8,10)}/${s.slice(5,7)}/${s.slice(0,4)}`:'—';
function getEmployee(id){return state.employees.find(x=>x.id===id)}
function getContract(id){return state.contracts.find(x=>x.id===id)}
function contractOfDoc(d){return getContract(d.contractId||getEmployee(d.employeeId)?.contractId)}
function docOwner(d){return d.scope==='company'?'Empresa':(getEmployee(d.employeeId)?.name||'Colaborador removido')}
function normalizeState(data){
 const obj={...stateDefault(),...data};
 if(!Array.isArray(obj.employees))obj.employees=[];
 if(!Array.isArray(obj.documents))obj.documents=[];
 if(!Array.isArray(obj.contracts))obj.contracts=[];
 // Registros criados na versão anterior viram contratos separados por filial/operação.
 for(const e of obj.employees){
  if(!obj.contracts.some(c=>c.id===e.contractId)){
   const unit=e.unit||'Sem localidade',sector=e.sector||'Geral';
   let c=obj.contracts.find(c=>c.legacyKey===unit+'|'+sector);
   if(!c){c={id:uid(),name:`${unit} — ${sector}`,unit,sector,client:'',legacyKey:unit+'|'+sector,createdAt:new Date().toISOString()};obj.contracts.push(c)}
   e.contractId=c.id;
  }
 }
 for(const d of obj.documents){
  if(d.scope!=='company')d.scope='employee';
  if(d.scope==='employee')d.contractId=getContractFromList(obj,getEmployeeFromList(obj,d.employeeId)?.contractId)?.id||d.contractId||'';
  if(!Array.isArray(d.history))d.history=[];
 }
 obj.version=2;
 return obj;
}
function getEmployeeFromList(obj,id){return obj.employees.find(e=>e.id===id)}
function getContractFromList(obj,id){return obj.contracts.find(c=>c.id===id)}
function status(doc){if(doc.noExpiry)return 'none';if(!doc.expiryDate)return 'none';const n=dayDiff(doc.expiryDate);return n<0?'expired':n<=30?'soon':'ok'}
function statusText(doc){const s=status(doc),d=dayDiff(doc.expiryDate);return s==='expired'?`Vencido há ${Math.abs(d)} ${Math.abs(d)===1?'dia':'dias'}`:s==='soon'?(d===0?'Vence hoje':`Faltam ${d} ${d===1?'dia':'dias'}`):s==='none'?'Vitalício':'Em dia'}
function pill(doc){let s=status(doc);return `<span class="pill ${s}"><span class="dot"></span>${esc(statusText(doc))}</span>`}
function activeDocs(){return state.documents.filter(d=>d.scope==='company'||(getEmployee(d.employeeId)&&getEmployee(d.employeeId).active!==false))}
function matchesContractFilter(d){return !filters.contract||contractOfDoc(d)?.id===filters.contract}
function validFilters(d){
 const e=d.scope==='company'?null:getEmployee(d.employeeId),c=contractOfDoc(d);
 if(d.scope!=='company'&&!e)return false;
 if(!matchesContractFilter(d))return false;
 if(filters.unit&&c?.unit!==filters.unit)return false;
 if(filters.sector&&c?.sector!==filters.sector)return false;
 if(filters.employee&&d.employeeId!==filters.employee)return false;
 if(filters.scope&&d.scope!==filters.scope)return false;
 if(filters.status&&(filters.status==='pending'?!['expired','soon'].includes(status(d)):status(d)!==filters.status))return false;
 if(filters.type&&d.type!==filters.type)return false;
 if(filters.search){
  const q=filters.search.toLocaleLowerCase('pt-BR');
  const hay=[d.type,d.fileName,d.notes,d.issueDate,d.expiryDate,e?.name,e?.reg,e?.sector,c?.name,c?.unit,c?.sector,c?.client,d.scope==='company'?'empresa pgr pcmso':'' ].join(' ').toLocaleLowerCase('pt-BR');
  if(!hay.includes(q))return false;
 }
 return true;
}
const sortDocs=(a,b)=>{let weight={expired:0,soon:1,ok:2,none:3};return weight[status(a)]-weight[status(b)] || (a.expiryDate||'9999').localeCompare(b.expiryDate||'9999') || docOwner(a).localeCompare(docOwner(b),'pt-BR')};
function filteredDocs(){return state.documents.filter(validFilters).sort(sortDocs)}
const unique=(k,source=state.contracts)=>[...new Set(source.map(e=>(e[k]||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
function selectOptions(items,value,all){return `<option value="">${esc(all)}</option>`+items.map(x=>`<option value="${esc(x)}" ${x===value?'selected':''}>${esc(x)}</option>`).join('')}
function contractSelect(value='',all='Todos os contratos'){return `<option value="">${esc(all)}</option>`+state.contracts.slice().sort((a,b)=>a.name.localeCompare(b.name,'pt-BR')).map(c=>`<option value="${c.id}" ${c.id===value?'selected':''}>${esc(c.name)}</option>`).join('')}
function avatar(name){return esc((name||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]?.toUpperCase()).join('')||'?')}
function updateGlobal(){const d=activeDocs(),n=d.filter(x=>['expired','soon'].includes(status(x))).length;$('#sidePending').textContent=`${n} ${n===1?'pendência':'pendências'}`;$('#syncBadge').textContent=syncEnabled?'Pasta local vinculada':'Salvo neste navegador';$('#syncBadge').className='sync-status'+(syncEnabled?' synced':' warn')}
function goto(p){page=p;window.scrollTo({top:0,behavior:'instant'});render()}
function render(){updateGlobal();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#topTitle').textContent={dashboard:'Visão geral',contracts:'Contratos',employees:'Colaboradores',documents:'Buscar arquivos',settings:'Configurações'}[page];$('#workspace').innerHTML=({dashboard:renderDashboard,contracts:renderContracts,employees:renderEmployees,documents:renderDocuments,settings:renderSettings}[page])()}
function docTable(docs,limit){
 const display=limit?docs.slice(0,limit):docs;
 if(!display.length)return empty('Nenhum PDF encontrado','Tente outro termo, selecione outro contrato ou cadastre o primeiro documento.');
 return `<div class="table-wrap"><table class="data-table"><thead><tr><th>Arquivo / documento</th><th>Localização</th><th>Validade</th><th>Situação</th><th style="text-align:right">Ações</th></tr></thead><tbody>${display.map(d=>{
 const c=contractOfDoc(d),e=getEmployee(d.employeeId);
 return `<tr><td class="mobile-main"><div class="doc-title">${esc(d.type)}</div><div class="file-sub">${esc(d.fileName||'Sem PDF')}${d.history?.length?' · '+d.history.length+' versão(ões)':''}</div></td><td class="mobile-sub"><div class="person">${esc(d.scope==='company'?'🏢 Empresa':e?.name||'Colaborador removido')}</div><div class="file-sub">${esc(c?.name||'Sem contrato')} / ${d.scope==='company'?'Empresa':'Funcionários'}</div></td><td class="mobile-date">${d.noExpiry?'Vitalício':brDate(d.expiryDate)}</td><td class="mobile-status">${pill(d)}</td><td class="mobile-actions"><div class="cell-actions">${d.fileId?`<button class="linkbtn" data-action="open-pdf" data-file="${d.fileId}">Abrir</button>`:''}<button class="linkbtn" data-action="doc-more" data-id="${d.id}">Detalhes</button><button class="linkbtn" data-action="doc-edit" data-id="${d.id}">Editar</button></div></td></tr>`}).join('')}</tbody></table></div>${limit&&docs.length>limit?`<div style="padding:14px 19px;text-align:center"><button class="btn small" data-page="documents">Ver todos os arquivos →</button></div>`:''}`;
}
function empty(title,desc){return `<div class="empty"><div class="empty-ico">▤</div><strong>${esc(title)}</strong><p>${esc(desc)}</p></div>`}
function alertNotice(d){const expired=d.filter(x=>status(x)==='expired').length,soon=d.filter(x=>status(x)==='soon').length;return expired||soon?`<div class="notice"><div><strong>⚠ Atenção: ${expired?' '+expired+' documento(s) vencido(s)':''}${expired&&soon?' e ':''}${soon?' '+soon+' a vencer em até 30 dias':''}</strong><p>Priorize a atualização dos PDFs para manter os registros em dia.</p></div><button class="btn small" data-action="show-pending">Ver pendências →</button></div>`:`<div class="notice good"><div><strong>✓ Sem vencimentos próximos</strong><p>Nenhum documento vencido ou a vencer nos próximos 30 dias neste conjunto de contratos.</p></div></div>`}
function renderDashboard(){
 const relevant=activeDocs().filter(d=>matchesContractFilter(d));
 const counts={expired:0,soon:0,ok:0,none:0};relevant.forEach(d=>counts[status(d)]++);
 const pending=relevant.filter(d=>['expired','soon'].includes(status(d))).sort(sortDocs);
 const contractCards=state.contracts.map(c=>{
  const e=state.employees.filter(x=>x.contractId===c.id),d=state.documents.filter(x=>contractOfDoc(x)?.id===c.id),company=d.filter(x=>x.scope==='company'),n=d.filter(x=>['expired','soon'].includes(status(x))).length;
  return `<button class="contract-list-row" data-action="contract-open" data-id="${c.id}"><div class="contract-symbol">▤</div><div class="contract-list-info"><strong>${esc(c.name)}</strong><span>${e.length} pessoas · ${company.length} PDFs da empresa · ${d.length} arquivos</span></div><span class="pill ${n?'soon':'ok'}">${n?n+' alerta(s)':'Em dia'}</span><span class="chev">›</span></button>`
 }).join('');
 return `<div class="page-intro"><div><h2>Seus documentos em ordem.</h2><p>Encontre qualquer PDF por nome, tipo ou contrato. Sem leitura automática dos arquivos.</p></div><button class="btn small" data-action="new-contract">＋ Novo contrato</button></div>
 <div class="hero-search"><div class="search-glyph">⌕</div><input id="home-search" class="hero-input" type="search" placeholder="Buscar Washington, NR-35, PCMSO, nome do PDF..." aria-label="Pesquisar documentos"><button class="btn primary" data-action="home-search">Pesquisar</button></div>
 ${alertNotice(relevant)}
 <div class="stats"><div class="stat red"><div><label>Vencidos</label><strong>${counts.expired}</strong></div><div class="ico">!</div></div><div class="stat amber"><div><label>Próximos 30 dias</label><strong>${counts.soon}</strong></div><div class="ico">◷</div></div><div class="stat green"><div><label>Documentos em dia</label><strong>${counts.ok}</strong></div><div class="ico">✓</div></div><div class="stat"><div><label>Vitalícios</label><strong>${counts.none}</strong></div><div class="ico">∞</div></div></div>
 <div class="two-col"><section class="panel"><div class="panel-header"><h3>Vencimentos que precisam de atenção</h3><button class="linkbtn" data-action="show-pending">Ver todos →</button></div>${pending.length?docTable(pending,6):empty('Sem pendências','Os documentos a vencer em 30 dias aparecem aqui.')}</section><section class="panel"><div class="panel-header"><h3>Contratos</h3><button class="linkbtn" data-page="contracts">Gerenciar →</button></div>${contractCards||empty('Nenhum contrato','Crie um contrato e comece a organizar seus PDFs.')}</section></div>`;
}
function renderContracts(){
 const cs=state.contracts.filter(c=>!filters.search||[c.name,c.unit,c.sector,c.client].join(' ').toLowerCase().includes(filters.search.toLowerCase()));
 return `<div class="page-intro"><div><h2>Contratos e suas pastas</h2><p>A organização de cada contrato é dividida em <b>Empresa</b> e <b>Funcionários</b>.</p></div><button class="btn primary" data-action="new-contract">＋ Novo contrato</button></div>
 <section class="panel"><div class="filters"><input id="f-search" class="control search" value="${esc(filters.search)}" placeholder="Buscar contrato, localidade, cliente..."></div>
 <div class="contract-grid">${cs.length?cs.map(c=>{
 const es=state.employees.filter(e=>e.contractId===c.id),ds=state.documents.filter(d=>contractOfDoc(d)?.id===c.id),company=ds.filter(d=>d.scope==='company'),person=ds.filter(d=>d.scope!=='company'),pend=ds.filter(d=>['expired','soon'].includes(status(d))).length;
 return `<article class="contract-card"><div class="contract-head"><div class="contract-symbol">▤</div><div><h3>${esc(c.name)}</h3><p>${esc([c.client,c.unit,c.sector].filter(Boolean).join(' • ')||'Organização documental')}</p></div></div><div class="contract-folders"><button data-action="company-docs" data-id="${c.id}"><span>▣</span><strong>Empresa</strong><small>${company.length} PDF(s)</small></button><button data-action="contract-employees" data-id="${c.id}"><span>♙</span><strong>Funcionários</strong><small>${es.length} pessoa(s) · ${person.length} PDF(s)</small></button></div><div class="contract-bottom">${pend?`<span class="pill soon">${pend} vencimento(s)</span>`:'<span class="pill ok">Sem vencimentos próximos</span>'}<button class="btn small" data-action="contract-edit" data-id="${c.id}">Editar contrato</button></div><div class="button-group"><button class="btn small" data-action="company-new" data-id="${c.id}">＋ PDF da empresa</button><button class="btn small" data-action="employee-new" data-id="${c.id}">＋ Funcionário</button></div></article>`}).join(''):empty('Nenhum contrato','Cadastre um contrato para criar as pastas Empresa e Funcionários.')}</div></section>`;
}
function renderEmployees(){
 const list=state.employees.filter(e=>(!filters.contract||e.contractId===filters.contract)&&(!filters.search||[e.name,e.reg,getContract(e.contractId)?.name,getContract(e.contractId)?.unit,...state.documents.filter(d=>d.employeeId===e.id).map(d=>d.type+' '+d.fileName)].join(' ').toLowerCase().includes(filters.search.toLowerCase()))).sort((a,b)=>Number(b.active!==false)-Number(a.active!==false)||a.name.localeCompare(b.name,'pt-BR'));

}
function renderDocuments(){
 const docs=filteredDocs();

<div class="setting"><div><h3>🔔 Notificações de vencimento</h3><p>Você recebe alertas no painel a partir de 30 dias antes do vencimento. Também é possível permitir avisos do sistema enquanto a página estiver aberta. Sem servidor, o navegador não envia notificações com o aplicativo fechado.</p></div><button class="btn" data-action="enable-notify">${('Notification'in window&&Notification.permission==='granted')?'Notificações ativas':'Ativar avisos'}</button></div>

function safeName(s){return String(s||'Nao_informado').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[<>:"\\/|?*\x00-\x1f]/g,'-').replace(/\.+$/,'').replace(/\s+/g,' ').trim().slice(0,80)||'Nao_informado'}

function makeFiles(){

  const root=contractDir(c),all=state.documents.filter(d=>contractOfDoc(d)?.id===c.id),company=all.filter(d=>d.scope==='company');
  files.set(`${root}/Empresa/dados_empresa.json`,{signature:'meta-'+state.modifiedAt,blob:utf8Json({contrato:c,documentos:company})});
  files.set(`${root}/Funcionarios/_organizacao.json`,{signature:'meta-'+state.modifiedAt,blob:utf8Json({contrato:c.id,funcionarios:state.employees.filter(e=>e.contractId===c.id).map(e=>({id:e.id,nome:e.name}))})});
 }
 for(const e of state.employees){const personal=state.documents.filter(d=>d.scope!=='company'&&d.employeeId===e.id),root=employeeDir(e).join('/');files.set(`${root}/dados_colaborador.json`,{signature:'meta-'+state.modifiedAt,blob:utf8Json({colaborador:e,documentos:personal})})}

async function performSync(){if(!baseHandle||!await checkPermission()){syncEnabled=false;render();return}if(syncBusy){syncAgain=true;return}syncBusy=true;$('#syncBadge').textContent='Sincronizando pasta...';try{const root=await baseHandle.getDirectoryHandle(FOLDER_NAME,{create:true});let previous={files:{}};try{previous=JSON.parse(await(await readFile(root,'_arquivos_gerenciados.json')).text())}catch{}const files=makeFiles(),newIndex={format:1,files:{}};for(const [path,item] of files){let exists=true;if(item.fileId&&previous.files?.[path]===item.signature){try{await readFile(root,path)}catch{exists=false}}if(!item.fileId||previous.files?.[path]!==item.signature||!exists){const blob=item.blob||await getPdf(item.fileId);if(!blob)throw Error('Arquivo PDF não encontrado: '+path);await setFile(root,path,blob)}newIndex.files[path]=item.signature}for(const old of Object.keys(previous.files||{})){if(!files.has(old))await removeFile(root,old)}for(const old of Object.keys(previous.files||{}).filter(x=>!files.has(x))){const segments=old.split('/');segments.pop();for(let j=segments.length;j>0;j--){const parent=segments.slice(0,j-1),leaf=segments[j-1];try{await(await getDir(root,parent,false)).removeEntry(leaf)}catch{}}}await setFile(root,'_arquivos_gerenciados.json',utf8Json(newIndex));syncEnabled=true;$('#syncBadge').className='sync-status synced';$('#syncBadge').textContent='Pasta sincronizada';}catch(e){console.error(e);syncEnabled=false;toast('Falha ao sincronizar pasta: '+e.message,true);$('#syncBadge').textContent='Erro na sincronização'}finally{syncBusy=false;if(syncAgain){syncAgain=false;scheduleSync()}else setTimeout(()=>updateGlobal(),2200)}}

async function connectFolder(restore=false){if(!('showDirectoryPicker'in window)){toast('Use o Chrome ou Edge atualizado para selecionar pastas. O backup ZIP funciona em outros navegadores.',true);return}try{const chosen=await window.showDirectoryPicker({id:'arquivo-documental',mode:'readwrite'});if(restore){await restoreFolder(chosen);return}try{const existingRoot=await chosen.getDirectoryHandle(FOLDER_NAME),existingFile=await readFile(existingRoot,'indice_geral.json'),existing=JSON.parse(await existingFile.text());if(existing.app==='ARQUIVO'&&existing.employees?.length){const remoteContracts=(existing.contracts||[]).map(x=>x.id).sort().join('|'),localContracts=state.contracts.map(x=>x.id).sort().join('|'),remoteIds=(existing.documents||[]).map(x=>x.id).sort().join('|'),localIds=state.documents.map(x=>x.id).sort().join('|'),remoteEmps=(existing.employees||[]).map(x=>x.id).sort().join('|'),localEmps=state.employees.map(x=>x.id).sort().join('|');if(remoteIds!==localIds||remoteEmps!==localEmps||remoteContracts!==localContracts){if(!state.employees.length&&!state.documents.length&&!state.contracts.length){if(confirm('Esta pasta já tem cadastros do ARQUIVO. Deseja RECUPERAR os colaboradores e PDFs existentes, em vez de substituí-los?'))await restoreFolder(chosen);else toast('Pasta mantida sem alterações.');return}if(!confirm('Esta pasta contém outro cadastro documental. Sincronizar substituirá seus registros gerenciados. Deseja prosseguir? Faça backup antes.'))return}}}catch(e){if(e.name!=='NotFoundError')console.warn('Pasta sem índice anterior ou índice ilegível',e)}baseHandle=chosen;await txn('kv','put',chosen,'folder');syncEnabled=await checkPermission(true);if(syncEnabled){toast('Pasta vinculada. Organizando os arquivos...');await performSync()}else toast('Permita acesso à pasta para sincronizar.',true);render()}catch(e){if(e.name!=='AbortError'){console.error(e);toast('Não foi possível selecionar a pasta.',true)}}}
async function restoreFolder(chosen){let root;try{root=await chosen.getDirectoryHandle(FOLDER_NAME);const file=await readFile(root,'indice_geral.json');const info=JSON.parse(await file.text());if(info.app!=='ARQUIVO'||!Array.isArray(info.documents)||!Array.isArray(info.employees))throw Error('Pasta não contém índice válido');if(!confirm(`Recuperar ${info.employees.length} colaborador(es) e ${info.documents.length} documento(s) da pasta? Isso substituirá o cadastro atual. Faça um backup antes.`))return;const restored={version:2,contracts:info.contracts||[],employees:info.employees,documents:[],modifiedAt:new Date().toISOString()};for(const doc of info.documents){const d={...doc};if(d.pdfPath){const file=await readFile(root,d.pdfPath);const id=uid();await putPdf(file,id);d.fileId=id;d.fileName=d.fileName||file.name}delete d.pdfPath;for(const h of d.history||[]){if(h.pdfPath){const file=await readFile(root,h.pdfPath),id=uid();await putPdf(file,id);h.fileId=id;h.fileName=h.fileName||file.name}delete h.pdfPath}restored.documents.push(d)}state=normalizeState(restored);baseHandle=chosen;await txn('kv','put',chosen,'folder');await txn('kv','put',state,'state');syncEnabled=await checkPermission(true);filters={contract:'',unit:'',sector:'',search:'',status:'',employee:'',type:'',scope:''};goto('dashboard');scheduleSync();toast('Cadastro e PDFs recuperados da pasta.')}catch(e){console.error(e);toast('Não foi possível recuperar: '+e.message,true)}}

function short(n){let b=new Uint8Array(2),v=new DataView(b.buffer);v.setUint16(0,n,true);return b}
function long(n){let b=new Uint8Array(4),v=new DataView(b.buffer);v.setUint32(0,n>>>0,true);return b}
async function zipFiles(entries){let out=[],central=[],offset=0;for(const [name,blob] of entries){const bytes=new Uint8Array(await blob.arrayBuffer()),fname=encoder.encode(name),crc=crc32(bytes),len=bytes.length;if(fname.length>65535||len>0xffffffff)throw Error('Arquivo grande demais para este formato ZIP');const head=[long(0x04034b50),short(20),short(0x0800),short(0),short(0),short(0),long(crc),long(len),long(len),short(fname.length),short(0),fname];out.push(...head,bytes);const cent=[long(0x02014b50),short(20),short(20),short(0x0800),short(0),short(0),short(0),long(crc),long(len),long(len),short(fname.length),short(0),short(0),short(0),short(0),long(0),long(offset),fname];central.push(...cent);offset+=head.reduce((a,b)=>a+b.length,0)+len}const centralLength=central.reduce((a,b)=>a+b.length,0),count=entries.length;if(count>65535)throw Error('Backup possui arquivos demais');return new Blob([...out,...central,long(0x06054b50),short(0),short(0),short(count),short(count),long(centralLength),long(offset),short(0)],{type:'application/zip'})}
async function exportBackup(){try{$('#syncBadge').textContent='Preparando backup...';const entries=[['cadastros.json',utf8Json(state)]];const ids=new Set();for(const d of state.documents){if(d.fileId)ids.add(d.fileId);for(const h of d.history||[])if(h.fileId)ids.add(h.fileId)}for(const id of ids){const pdf=await getPdf(id);if(!pdf)throw Error('PDF não encontrado: '+id);entries.push([`pdfs/${id}.pdf`,pdf])}downloadBlob(await zipFiles(entries),`Backup_Arquivo_${today()}.zip`);toast(`Backup concluído: ${ids.size} PDF(s).`)}catch(e){console.error(e);toast('Erro ao gerar backup: '+e.message,true)}finally{updateGlobal()}}
async function unzipOwn(file){const b=await file.arrayBuffer(),view=new DataView(b),out=new Map(),dec=new TextDecoder();let i=0;while(i+30<=b.byteLength){const sig=view.getUint32(i,true);if(sig===0x02014b50||sig===0x06054b50)break;if(sig!==0x04034b50)throw Error('Arquivo ZIP inválido ou não suportado');const flags=view.getUint16(i+6,true),method=view.getUint16(i+8,true),size=view.getUint32(i+18,true),fl=view.getUint16(i+26,true),extra=view.getUint16(i+28,true);if(flags&8||method!==0)throw Error('Importe um ZIP gerado por este aplicativo (formato sem compactação)');const name=dec.decode(new Uint8Array(b,i+30,fl));i+=30+fl+extra;if(i+size>b.byteLength)throw Error('ZIP incompleto');out.set(name,new Blob([b.slice(i,i+size)]));i+=size}return out}
async function importBackup(file){try{const files=await unzipOwn(file),metadata=files.get('cadastros.json');if(!metadata)throw Error('O ZIP não é um backup do ARQUIVO');const restored=JSON.parse(await metadata.text());if(!Array.isArray(restored.employees)||!Array.isArray(restored.documents))throw Error('Dados inválidos');if(!confirm(`Importar ${restored.employees.length} colaborador(es) e ${restored.documents.length} documento(s)? Isso substituirá o cadastro atual. Faça um backup antes.`))return;const ids=new Set();for(const d of restored.documents){if(d.fileId)ids.add(d.fileId);for(const h of d.history||[])if(h.fileId)ids.add(h.fileId)}for(const id of ids)if(!files.has(`pdfs/${id}.pdf`))throw Error('PDF ausente no backup: '+id);for(const id of ids)await putPdf(files.get(`pdfs/${id}.pdf`),id);state=normalizeState({...restored,modifiedAt:new Date().toISOString()});await txn('kv','put',state,'state');filters={contract:'',unit:'',sector:'',search:'',status:'',employee:'',type:'',scope:''};goto('dashboard');scheduleSync();toast(`Backup restaurado: ${ids.size} arquivo(s) PDF.`)}catch(e){console.error(e);toast('Falha na importação: '+e.message,true)}}
async function downloadPdf(fileId,filename){try{const blob=await getPdf(fileId);if(!blob)throw Error('Arquivo não encontrado');downloadBlob(blob,filename||'documento.pdf')}catch(e){toast(e.message,true)}}
async function openPdf(fileId){
 // Open a blank tab synchronously from the click to avoid popup blockers while reading IndexedDB.
 const tab=window.open('','_blank');
 try{const blob=await getPdf(fileId);if(!blob)throw Error('PDF não encontrado.');const url=URL.createObjectURL(new Blob([blob],{type:'application/pdf'}));if(tab){tab.location.href=url;setTimeout(()=>URL.revokeObjectURL(url),180000)}else{const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.click();setTimeout(()=>URL.revokeObjectURL(url),180000)}}catch(e){if(tab)tab.close();toast(e.message,true)}
}
async function deleteContract(id){
 const c=getContract(id);if(!c)return;
 const people=state.employees.filter(x=>x.contractId===id),docs=state.documents.filter(d=>contractOfDoc(d)?.id===id);
 if(!confirm(`Excluir o contrato "${c.name}" com ${people.length} funcionário(s) e ${docs.length} documento(s)? Essa ação removerá os arquivos da pasta sincronizada. Faça backup antes.`))return;
 state.documents=state.documents.filter(d=>contractOfDoc(d)?.id!==id);
 state.employees=state.employees.filter(e=>e.contractId!==id);
 state.contracts=state.contracts.filter(x=>x.id!==id);
 filters.contract='';filters.employee='';closeModal();await save();toast('Contrato excluído.');
}
function resetFilters(){filters={contract:'',unit:'',sector:'',search:'',status:'',employee:'',type:'',scope:''}}
async function deleteEmployee(id){const e=getEmployee(id);if(!e)return;const n=state.documents.filter(d=>d.employeeId===id).length;if(!confirm(`Excluir ${e.name} e seus ${n} documento(s), incluindo PDFs e versões anteriores? Esta exclusão é definitiva no cadastro e na pasta sincronizada. Faça um backup antes.`))return;state.documents=state.documents.filter(d=>d.employeeId!==id);state.employees=state.employees.filter(x=>x.id!==id);if(filters.employee===id)filters.employee='';closeModal();await save();toast('Colaborador e documentos excluídos.')}
async function deleteDoc(id){const d=state.documents.find(x=>x.id===id);if(!d)return;if(!confirm(`Excluir o cadastro "${d.type}" e seu histórico? Os arquivos desta entrada serão removidos da pasta sincronizada. Faça backup se precisar preservá-los.`))return;state.documents=state.documents.filter(x=>x.id!==id);closeModal();await save();toast('Documento excluído.');}
async function notifyDue(){if(!('Notification'in window)||Notification.permission!=='granted')return;let d=activeDocs().filter(x=>['expired','soon'].includes(status(x)));if(!d.length)return;try{const key=`arquivo_avisou_${today()}`;if(localStorage.getItem(key))return;new Notification('ARQUIVO • Vencimentos de documentos',{body:`Você tem ${d.length} documento(s) vencido(s) ou a vencer em 30 dias.`});localStorage.setItem(key,'1')}catch(e){console.warn(e)}}
async function allowNotify(){if(!('Notification'in window)||!window.isSecureContext){toast('Notificações requerem navegador e contexto seguro (HTTPS ou localhost).',true);return}try{const permission=await Notification.requestPermission();if(permission==='granted'){toast('Avisos autorizados (enquanto o app estiver aberto).');notifyDue()}else toast('Permissão não concedida. Os avisos continuam no painel.')}catch(e){toast('Não foi possível ativar notificações.',true)}render()}
function selectFilter(id,val){filters[id]=val;if(id==='employee'&&page==='documents'){}render()}
// Delegação de eventos: os elementos das listas são regenerados a cada atualização.
document.addEventListener('click',async ev=>{
 const pag=ev.target.closest('[data-page]');if(pag){if(page!==pag.dataset.page)filters.search='';goto(pag.dataset.page);return}
 const el=ev.target.closest('[data-action]');if(!el)return;
 const action=el.dataset.action,id=el.dataset.id;
 try{switch(action){
  case 'new-contract':contractDialog();break;
  case 'contract-edit':contractDialog(id);break;
  case 'contract-remove':await deleteContract(id);break;
  case 'contract-open':filters.contract=id;filters.employee='';filters.scope='';goto('documents');break;
  case 'company-docs':filters.contract=id;filters.scope='company';filters.employee='';filters.status='';filters.search='';goto('documents');break;
  case 'contract-employees':filters.contract=id;filters.search='';goto('employees');break;
  case 'company-new':docDialog(null,null,id);break;
  case 'employee-new':employeeDialog(null,id);break;
  case 'new-employee':employeeDialog();break;
  case 'employee-edit':employeeDialog(id);break;
  case 'new-doc':docDialog(null,id);break;
  case 'doc-edit':docDialog(id);break;
  case 'doc-more':docDetails(id);break;
  case 'employee-docs':filters.employee=id;filters.contract=getEmployee(id)?.contractId||'';filters.scope='employee';filters.status='';filters.search='';goto('documents');break;
  case 'show-pending':filters.search='';filters.status='pending';goto('documents');break;
  case 'home-search':filters.search=$('#home-search')?.value.trim()||'';filters.status='';filters.scope='';filters.contract='';filters.employee='';goto('documents');break;
  case 'clear-filters':resetFilters();render();break;
  case 'close-modal':closeModal();break;
  case 'doc-remove':await deleteDoc(id);break;
  case 'employee-remove':await deleteEmployee(id);break;
  case 'download-pdf':await downloadPdf(el.dataset.file,el.dataset.name);break;
  case 'open-pdf':await openPdf(el.dataset.file);break;
  case 'connect-folder':await connectFolder(false);break;
  case 'sync-folder':if(!await checkPermission(true)){toast('Reconecte a pasta e autorize o acesso.',true)}else{syncEnabled=true;await performSync()}render();break;
  case 'restore-folder':await connectFolder(true);break;
  case 'export-backup':await exportBackup();break;
  case 'import-backup':$('#backupInput')?.click();break;
  case 'enable-notify':await allowNotify();break;
 }}catch(e){console.error(e);toast('Não foi possível concluir a operação: '+e.message,true)}
});
document.addEventListener('change',async ev=>{
 const el=ev.target;
 if(el.id==='backupInput'&&el.files?.length){await importBackup(el.files[0]);el.value='';return}
 if(el.id==='f-contract'){filters.contract=el.value;filters.employee='';render();return}
 if(el.id==='f-unit')return selectFilter('unit',el.value);
 if(el.id==='f-sector')return selectFilter('sector',el.value);
 if(el.id==='f-status')return selectFilter('status',el.value);
 if(el.id==='f-employee')return selectFilter('employee',el.value);
 if(el.id==='f-scope'){filters.scope=el.value;if(el.value==='company')filters.employee='';render();return}
 if(el.closest('#documentForm')){
  const form=el.closest('form');
  if(['scope','contractId','employeeId'].includes(el.name)){updateDestinationControls();return}
  if(el.name==='pdf'&&el.files[0]){const file=el.files[0];$('#uploadTitle').textContent=`📎 ${file.name}`;$('#uploadLabel').classList.add('has-file')}
  if(['issueDate','periodAmount','periodUnit'].includes(el.name)&&!form.elements.noExpiry.checked){const auto=addPeriod(form.elements.issueDate.value,form.elements.periodAmount.value,form.elements.periodUnit.value);if(auto)form.elements.expiryDate.value=auto}
  if(el.name==='noExpiry'){form.elements.expiryDate.disabled=el.checked;if(el.checked)form.elements.expiryDate.value='';else if(form.elements.issueDate.value)form.elements.expiryDate.value=addPeriod(form.elements.issueDate.value,form.elements.periodAmount.value,form.elements.periodUnit.value)}
 }
});
let searchTimeout;document.addEventListener('input',ev=>{
 if(ev.target.id==='f-search'){
  const el=ev.target,v=el.value,start=el.selectionStart;
  clearTimeout(searchTimeout);searchTimeout=setTimeout(()=>{filters.search=v;render();const newer=$('#f-search');if(newer){newer.focus();newer.setSelectionRange(Math.min(start,newer.value.length),Math.min(start,newer.value.length))}},180);
 }
 if(ev.target.closest('#documentForm')&&['issueDate','periodAmount'].includes(ev.target.name)){
  const form=ev.target.closest('form');if(!form.elements.noExpiry.checked&&form.elements.issueDate.value)form.elements.expiryDate.value=addPeriod(form.elements.issueDate.value,form.elements.periodAmount.value,form.elements.periodUnit.value)
 }
});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='home-search'){ev.preventDefault();filters.search=ev.target.value.trim();filters.status='';filters.contract='';filters.scope='';filters.employee='';goto('documents')}});
document.addEventListener('submit',async ev=>{
 const form=ev.target;if(!['contractForm','employeeForm','documentForm'].includes(form.id))return;
 ev.preventDefault();const submitter=document.querySelector(`[form="${form.id}"][type="submit"]`);if(submitter)submitter.disabled=true;
 try{if(form.id==='contractForm')await submitContract(form);else if(form.id==='employeeForm')await submitEmployee(form);else await submitDocument(form)}catch(e){console.error(e);toast('Erro ao salvar: '+e.message,true)}finally{if(submitter)submitter.disabled=false}
});
document.addEventListener('click',e=>{if(e.target.id==='modalShade')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
async function init(){try{await openDb();state=normalizeState(await txn('kv','get','state')||stateDefault());await txn('kv','put',state,'state');baseHandle=await txn('kv','get','folder')||null;syncEnabled=await checkPermission(false);render();if(syncEnabled)scheduleSync();notifyDue();setInterval(()=>{render();notifyDue()},3600000)}catch(e){console.error(e);$('#workspace').innerHTML=`<div class="notice"><div><strong>Não foi possível abrir o armazenamento local</strong><p>Abra esta página no Chrome ou Edge (preferencialmente em HTTPS ou localhost), com os dados de sites permitidos. ${esc(e.message)}</p></div></div>`}}
init();
</script>
</body>
